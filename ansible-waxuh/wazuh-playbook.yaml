---
- hosts: webservers
  become: yes
  tasks:
    - name: get url
      get_url:
        url: https://packages.wazuh.com/4.x/apt/pool/main/w/wazuh-agent/wazuh-agent_4.7.5-1_amd64.deb 
        dest: /tmp/temp
    - name: execute downlaod comand
      shell: WAZUH_MANAGER='192.168.1.229' dpkg -i /tmp/temp
    - name: restart
      service:
        state: started
        enabled: true
        name: wazuh-agent


